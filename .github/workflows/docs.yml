name: Docs

on:
  push:
    branches: [main]
    paths:
      - readme.org
      - docs/**
      - crucible.png
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - readme.org
      - docs/**
      - crucible.png
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Build site
        run: docs/site/build.sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Pull requests only check that the site builds; main deploys it.
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
