name: Release

# Publishes to PyPI when a GitHub release is published. The release tag must
# match the version in pyproject.toml (v0.2.0 or 0.2.0 for version 0.2.0).
# Uses PyPI trusted publishing: no token is stored in the repository.

on:
  release:
    types: [published]
  workflow_dispatch:   # build and check only; never publishes

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[mcp]" pytest
      - run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check the tag matches the package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Release tag $TAG does not match pyproject.toml version $version"
            exit 1
          fi
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Use the readme as the PyPI description
        # PyPI cannot render org, so convert readme.org to Markdown for this
        # build and point pyproject.toml at it.
        run: |
          docs/site/pypi-readme.sh README.pypi.md
          sed -i 's/^license = /readme = "README.pypi.md"\nlicense = /' pyproject.toml
          grep -n '^readme' pyproject.toml
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/crucible-llm/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
